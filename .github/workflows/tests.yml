name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [server, web-app]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    # Known-vulnerable dependencies, checked on every push (DEP-1). Dependabot
    # raises the pull requests; this is the gate that says so at the time.
    #
    # What blocks and what only reports is deliberate. A high or critical
    # advisory in a package that SHIPS is a real exposure and fails the build.
    # A dev-only one — a bundler, a linter, a test runner — cannot be reached by
    # a player, so it is reported and left visible rather than blocking a
    # release over the build toolchain. Both are worth knowing; only one is
    # worth stopping for.
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [server, web-app]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci

      - name: Production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: All dependencies, including dev (informational)
        continue-on-error: true
        run: npm audit

      # A record of exactly what shipped, which is what makes it possible to
      # answer "were we affected?" about an advisory published next month.
      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom-${{ matrix.package }}.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: sbom-${{ matrix.package }}
          path: ${{ matrix.package }}/sbom-${{ matrix.package }}.json
          retention-days: 90

  postgres:
    # The driver production actually uses (DB-1). Local runs default to SQLite
    # because it needs no setup; without this job, nothing would ever exercise
    # the Postgres path and it would rot silently. Runs the server unit tests
    # and the `api` project, which together cover every store operation —
    # browser projects would only re-test the UI over the same server.
    name: Postgres driver (unit + api)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prompted
          POSTGRES_DB: prompted_test
        ports: ['5432:5432']
        # Don't start the tests before the database can answer.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:prompted@localhost:5432/prompted_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web-app/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Install web-app dependencies
        run: npm ci
        working-directory: web-app

      - name: Server unit tests on Postgres
        run: npm test
        working-directory: server

      # The config gives each run its own schema, so these two steps can't
      # collide with each other or with anything left behind by an earlier run.
      - name: API suite on Postgres
        run: npx playwright test --project=api --reporter=list
        working-directory: web-app

      - name: Upload traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-postgres
          path: web-app/test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    # One job per Playwright project, so the configurations run side by side
    # and each installs only the browser it needs. The `api` project drives
    # the server over socket.io and needs no browser at all.
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # WebKit jobs run with 2 workers instead of the config's default 4. On a
      # 4-core runner, four workers (some driving three browser contexts each)
      # starved mobile-safari until clicks timed out waiting for elements to be
      # "visible, enabled and stable": the same machine-load failure the
      # config's workers comment describes, not a product bug.
      matrix:
        include:
          - project: api
            browser: ''
            workers: ''
          - project: chromium
            browser: chromium
            workers: ''
          - project: mobile-chrome
            browser: chromium
            workers: ''
          - project: webkit
            browser: webkit
            workers: 2
          - project: mobile-safari
            browser: webkit
            workers: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web-app/package-lock.json

      # The suite boots the real backend itself, so it needs server deps too.
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Install web-app dependencies
        run: npm ci
        working-directory: web-app
      - name: Install Playwright browser
        if: ${{ matrix.browser != '' }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: web-app

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --reporter=list,html
        working-directory: web-app
        env:
          # Empty means "use the config default" (Number('') || 4).
          PW_WORKERS: ${{ matrix.workers }}

      # Traces are kept only for failures (retain-on-failure in the config),
      # so a red run can be downloaded and stepped through in the trace viewer.
      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}
          path: |
            web-app/playwright-report/
            web-app/test-results/
          retention-days: 14
          if-no-files-found: ignore
