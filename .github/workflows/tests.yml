name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Unit tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [server, web-app]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    # One job per Playwright project, so the configurations run side by side
    # and each installs only the browser it needs. The `api` project drives
    # the server over socket.io and needs no browser at all.
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # WebKit jobs run with 2 workers instead of the config's default 4. On a
      # 4-core runner, four workers (some driving three browser contexts each)
      # starved mobile-safari until clicks timed out waiting for elements to be
      # "visible, enabled and stable": the same machine-load failure the
      # config's workers comment describes, not a product bug.
      matrix:
        include:
          - project: api
            browser: ''
            workers: ''
          - project: chromium
            browser: chromium
            workers: ''
          - project: mobile-chrome
            browser: chromium
            workers: ''
          - project: webkit
            browser: webkit
            workers: 2
          - project: mobile-safari
            browser: webkit
            workers: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web-app/package-lock.json

      # The suite boots the real backend itself, so it needs server deps too.
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Install web-app dependencies
        run: npm ci
        working-directory: web-app
      - name: Install Playwright browser
        if: ${{ matrix.browser != '' }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: web-app

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }} --reporter=list,html
        working-directory: web-app
        env:
          # Empty means "use the config default" (Number('') || 4).
          PW_WORKERS: ${{ matrix.workers }}

      # Traces are kept only for failures (retain-on-failure in the config),
      # so a red run can be downloaded and stepped through in the trace viewer.
      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            web-app/playwright-report/
            web-app/test-results/
          retention-days: 14
          if-no-files-found: ignore
